<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Upload Tool</title>
<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; }
.container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
input, button { padding:10px; margin:5px 0; width:100%; }
.preview { margin-top:20px; border-top:1px solid #ddd; padding-top:20px; }
.card { border:1px solid #ddd; padding:15px; margin-top:10px; border-radius:10px; display:flex; gap:15px; }
.card img { width:120px; height:120px; object-fit:cover; border-radius:10px; }
.export-btn { background:#28a745; color:#fff; border:none; cursor:pointer; }
</style>
</head>
<body>

<div class="container">
<h2>Product Upload Tool</h2>

<input type="file" id="image" accept="image/*">
<input type="text" id="name" placeholder="Product Name">
<input type="number" id="mrp" placeholder="MRP">
<input type="number" id="discount" placeholder="Discount (%)">

<button onclick="addProduct()">Add Product</button>
<button class="export-btn" onclick="exportToWord()">Export to Word</button>

<div class="preview" id="preview"></div>
</div>

<script>
let products = [];

function addProduct() {
    const imageInput = document.getElementById('image');
    const name = document.getElementById('name').value;
    const mrp = parseFloat(document.getElementById('mrp').value);
    const discount = parseFloat(document.getElementById('discount').value);

    if (!imageInput.files[0] || !name || !mrp || !discount) {
        alert('Please fill all fields');
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const finalPrice = mrp - (mrp * discount / 100);

        const product = {
            image: e.target.result,
            name,
            mrp,
            discount,
            finalPrice: finalPrice.toFixed(2)
        };

        products.push(product);
        renderProducts();
    };

    reader.readAsDataURL(imageInput.files[0]);
}

function renderProducts() {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';

    products.forEach(p => {
        preview.innerHTML += `
        <div class="card">
            <img src="${p.image}" />
            <div>
                <h3>${p.name}</h3>
                <p>MRP: ₹${p.mrp}</p>
                <p>Discount: ${p.discount}%</p>
                <h4>Final Price: ₹${p.finalPrice}</h4>
            </div>
        </div>`;
    });
}

function exportToWord() {
    if (products.length === 0) {
        alert('No products to export');
        return;
    }

    let content = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' 
          xmlns:w='urn:schemas-microsoft-com:office:word' 
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>Products</title></head>
    <body>
    <h2>Product List</h2>`;

    products.forEach(p => {
        content += `
        <div style="margin-bottom:20px;">
            <img src="${p.image}" width="120" /><br>
            <strong>${p.name}</strong><br>
            MRP: ₹${p.mrp}<br>
            Discount: ${p.discount}%<br>
            Final Price: ₹${p.finalPrice}<br>
        </div>`;
    });

    content += `</body></html>`;

    // FIX: Better download method
    const blob = new Blob(['﻿', content], {
        type: 'application/msword'
    });

    const fileName = 'products.doc';

    // For modern browsers
    if (window.navigator && window.navigator.msSaveOrOpenBlob) {
        window.navigator.msSaveOrOpenBlob(blob, fileName);
    } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.style.display = 'none';
        document.body.appendChild(link);

        // IMPORTANT FIX
        setTimeout(() => {
            link.click();
            document.body.removeChild(link);
        }, 100);
    }
}

    let content = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' 
          xmlns:w='urn:schemas-microsoft-com:office:word' 
          xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>Products</title></head>
    <body>
    <h2>Product List</h2>`;

    products.forEach(p => {
        content += `
        <div style="margin-bottom:20px;">
            <img src="${p.image}" width="120" /><br>
            <strong>${p.name}</strong><br>
            MRP: ₹${p.mrp}<br>
            Discount: ${p.discount}%<br>
            Final Price: ₹${p.finalPrice}<br>
        </div>`;
    });

    content += `</body></html>`;

    const blob = new Blob([content], {
        type: 'application/vnd.ms-word;charset=utf-8;'
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'products.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
